{{- if .Values.postgresql.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.postgresql.name }}
  namespace: {{ .Values.global.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "-5"
spec:
  replicas: 1
  # The PVC is ReadWriteOnce, so the old pod must stop before the new one starts
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: {{ .Values.postgresql.name }}
  template:
    metadata:
      labels:
        app: {{ .Values.postgresql.name }}
    spec:
      containers:
        - name: {{ .Values.postgresql.name }}
          image: {{ .Values.postgresql.image.name }}:{{ .Values.postgresql.image.tag }}
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRESQL_USER
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.postgresql.name }}-credentials
                  key: username
            - name: POSTGRESQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.postgresql.name }}-credentials
                  key: password
            - name: POSTGRESQL_DATABASE
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.postgresql.name }}-credentials
                  key: database
          readinessProbe:
            exec:
              command:
                - /usr/libexec/check-container
            initialDelaySeconds: 5
          volumeMounts:
            - name: data-volume
              mountPath: /var/lib/pgsql/data
          {{- if .Values.postgresql.ssl }}
            # *.conf files in this directory are included in the PostgreSQL configuration
            - name: config-volume
              mountPath: /opt/app-root/src/postgresql-cfg
            - name: ssl-volume
              mountPath: /etc/pgsql-tls
              readOnly: true
          {{- end }}
      volumes:
        - name: data-volume
          persistentVolumeClaim:
            claimName: {{ .Values.postgresql.name }}-data
      {{- if .Values.postgresql.ssl }}
        - name: config-volume
          configMap:
            name: {{ .Values.postgresql.name }}-ssl
        - name: ssl-volume
          secret:
            secretName: {{ .Values.postgresql.name }}-tls
            defaultMode: 0440
      {{- end }}
{{- end }}
