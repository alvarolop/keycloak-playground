{{- if and .Values.postgresql.enabled .Values.postgresql.ssl }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.postgresql.name }}-ssl
  namespace: {{ .Values.global.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "-5"
data:
  ssl.conf: |
    ssl = on
    ssl_cert_file = '/etc/pgsql-tls/tls.crt'
    ssl_key_file = '/etc/pgsql-tls/tls.key'
{{- end }}
