# Default values for keycloak.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

global:
  namespace: keycloak
  clusterDomain: $BASE_DOMAIN # ocp.sandboxXXX.example.com

operator:
  enabled: true
  channel: stable-v26.6
  installPlanApproval: Automatic

keycloak:
  bootstrapAdmin:
    username: admin
    password: admin
  # logging:
  #   # Set the log output to JSON or default (plain) unstructured logging
  #   logConsoleOutput: json
  # https://www.keycloak.org/high-availability/multi-cluster/deploy-keycloak-kubernetes
  metrics:
    enabled: true
    eventMetricsUserEnabled: true
    grafanaDashboardsEnabled: false
  resources:
    requests:
      cpu: 300m
      memory: 1700Mi
    limits:
      cpu: '2'
      memory: 2Gi

postgresql:
  enabled: true
  name: postgresql-db
  ssl: true
  image:
    name: registry.redhat.io/rhel9/postgresql-18
    tag: "9.9"

realms:
  - name: demo
    displayName: Demo Realm
    clients:
      - name: quarkus-petclinic
        # Authorization Services: any user in 'staff' can access the app,
        # only users with the 'vet' role can access /vets.html
        authorization:
          scopes:
            - view
          resources:
            - name: Default Resource
              uris: ["/*"]
              scopes: [view]
            - name: Vets Resource
              uris: ["/vets.html"]
              scopes: [view]
          policies:
            - name: Default Group Policy
              type: group
              groups:
                - path: /staff
                  extendChildren: true
            - name: Vet Role Policy
              type: role
              roles:
                - id: vet
                  required: false
          permissions:
            - name: Default Resource Permission
              resources: [Default Resource]
              scopes: [view]
              policies: [Default Group Policy]
            - name: Vets Resource Permission
              resources: [Vets Resource]
              scopes: [view]
              policies: [Vet Role Policy]
    groups:
      - name: staff
        subGroups:
          - name: personal-staff
    roles:
      - name: vet
        description: Veterinarian role
      - name: assistant
        description: Assistant role
    users:
      - username: alice
        password: alice
        firstName: Alice
        lastName: Doe
        email: alice@example.com
        emailVerified: true
        enabled: true
        createdTimestamp: 1759276800000 # 2025-10-01T00:00:00Z
        realmRoles:
          - vet
        groups:
          - staff/personal-staff
      - username: bob
        password: bob
        firstName: Bob
        lastName: Doe
        email: bob@example.com
        emailVerified: true
        enabled: true
        createdTimestamp: 1759276800000 # 2025-10-01T00:00:00Z
        realmRoles:
          - assistant
        groups:
          - staff/personal-staff
  # Realm to demo the OpenShift AI integration with an external OIDC provider
  # https://docs.redhat.com/en/documentation/red_hat_openshift_ai_self-managed/3.5/html/managing_openshift_ai/configuring-external-oidc-provider_managing-rhoai
  - name: openshift-ai
    displayName: OpenShift AI Realm
    clients:
      - name: data-science-gateway
        redirectUris:
          - "https://rh-ai.apps.{{ .Values.global.clusterDomain }}/oauth2/callback"
        # Expose the groups of the user in the tokens so they can be mapped to OpenShift RBAC
        protocolMappers:
          - name: groups
            protocol: openid-connect
            protocolMapper: oidc-group-membership-mapper
            consentRequired: false
            config:
              claim.name: groups
              full.path: "false"
              id.token.claim: "true"
              access.token.claim: "true"
              userinfo.token.claim: "true"
    groups:
      # Platform groups: access to the OpenShift AI dashboard and projects
      - name: odh-admins
      - name: odh-users
      # Acme Corp (fake company) with two consumer teams. The groups claim carries the team name (for example
      # acme-support), so each one can get a different MaaSSubscription/MaaSAuthPolicy and a different set of models
      - name: acme
        subGroups:
          - name: acme-support
          - name: acme-engineering
    users:
      - username: ai-admin
        password: ai-admin
        firstName: Ada
        lastName: Admin
        email: ai-admin@example.com
        emailVerified: true
        enabled: true
        createdTimestamp: 1759276800000 # 2025-10-01T00:00:00Z
        groups:
          - odh-admins
          - odh-users
      - username: support-lead
        password: support-lead
        firstName: Sara
        lastName: Support
        email: support-lead@acme.example.com
        emailVerified: true
        enabled: true
        createdTimestamp: 1759276800000 # 2025-10-01T00:00:00Z
        groups:
          - acme/acme-support
          - odh-users
      - username: support-agent
        password: support-agent
        firstName: Sam
        lastName: Agent
        email: support-agent@acme.example.com
        emailVerified: true
        enabled: true
        createdTimestamp: 1759276800000 # 2025-10-01T00:00:00Z
        groups:
          - acme/acme-support
          - odh-users
      - username: eng-lead
        password: eng-lead
        firstName: Eva
        lastName: Engineer
        email: eng-lead@acme.example.com
        emailVerified: true
        enabled: true
        createdTimestamp: 1759276800000 # 2025-10-01T00:00:00Z
        groups:
          - acme/acme-engineering
          - odh-users
      - username: eng-dev
        password: eng-dev
        firstName: Dan
        lastName: Developer
        email: eng-dev@acme.example.com
        emailVerified: true
        enabled: true
        createdTimestamp: 1759276800000 # 2025-10-01T00:00:00Z
        groups:
          - acme/acme-engineering
          - odh-users
      # Authenticates but belongs to no team: no model access
      - username: outsider
